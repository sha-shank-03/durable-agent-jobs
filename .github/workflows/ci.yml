name: Java 17 local mock verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-agent-jobs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: pwsh
    env:
      MAVEN_OPTS: -Xmx512m -XX:MaxMetaspaceSize=256m
    steps:
      - name: Checkout with read-only token
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve pinned dependencies, test and package
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MAVEN_USER_HOME = Join-Path (Get-Location) 'work/maven-user-home'
          if ($IsWindows) {
            .\tools\bootstrap.ps1
            .\mvnw.cmd -B -ntp verify
          } else {
            sh ./mvnw -B -ntp verify
          }
          if ($LASTEXITCODE -ne 0) { throw 'Maven verification failed.' }
      - name: Assert offline fictional packaged demos
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work/ci | Out-Null
          java -Xmx256m -XX:MaxMetaspaceSize=128m -jar target/durable-agent-jobs.jar demo --dir work/ci/happy --scenario happy > work/ci/happy.json
          if ($LASTEXITCODE -ne 0) { throw 'Happy mock demo failed.' }
          java -Xmx256m -XX:MaxMetaspaceSize=128m -jar target/durable-agent-jobs.jar demo --dir work/ci/recovery --scenario all > work/ci/all.json
          if ($LASTEXITCODE -ne 0) { throw 'Recovery mock demo failed.' }
          python tools/verify-release.py --happy work/ci/happy.json --all work/ci/all.json --output work/ci/package-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Independent SQL/package verification failed.' }
